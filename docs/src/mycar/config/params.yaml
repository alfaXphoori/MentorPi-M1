camera_setup:
  ros__parameters:
    servo_id: 2
    default_pos: 500
    min_pos: 300
    max_pos: 700

lane_node:
  ros__parameters:
    lower_yellow: [20, 100, 100]
    upper_yellow: [40, 255, 255]
    lower_white: [0, 0, 200]
    upper_white: [180, 50, 255]
    use_white: false
    base_speed: 0.15
    kp: 0.005
    show_debug: false

lidar_safety:
  ros__parameters:
    safe_distance: 0.5
    stop_distance: 0.3

yolo_logic:
  ros__parameters:
    turn_duration: 2.0
    stop_duration: 3.0
    min_score: 0.7

mission_manager:
  ros__parameters:
    use_imu: false # Placeholder for future IMU integration

